# =============================================================================
# AETHERION PRODUCTION DOCKER COMPOSE CONFIGURATION (Strict Production Mode)
# =============================================================================
# Requirements:
# 1. Environment variables MUST be set via .env or orchestration secrets.
# 2. Strict startup ordering: Postgres & Redis healthy -> Migration completes -> Backend healthy -> Workers start.
# 3. Dedicated non-root users (aetherion:aetherion 10001:10001).
# 4. Fail-closed on missing secrets or unavailable dependencies.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherion-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aetherion}
      POSTGRES_USER: ${POSTGRES_USER:-aetherion_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured for production}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetherion_user} -d ${POSTGRES_DB:-aetherion}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aetherion_prod_net

  redis:
    image: redis:7-alpine
    container_name: aetherion-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aetherion_prod_net

  db-migrate:
    image: "${AETHERION_BACKEND_IMAGE:-aetherion-backend:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: aetherion-db-migrate-prod
    restart: "no"
    working_dir: /app/workspace
    environment:
      ENVIRONMENT: production
      AETHERION_RELEASE_SCOPE: control-plane
      AETHERION_EXECUTION_DISABLED: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aetherion_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured for production}@postgres:5432/${POSTGRES_DB:-aetherion}"
      PYTHONPATH: /app
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be configured for production}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured for production}"
    volumes:
      - workspace_prod_data:/app/workspace
    command: ["python", "/app/scripts/db_migrate.py", "--up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aetherion_prod_net

  backend:
    image: "${AETHERION_BACKEND_IMAGE:-aetherion-backend:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: aetherion-backend-prod
    restart: unless-stopped
    working_dir: /app/workspace
    environment:
      ENVIRONMENT: production
      AETHERION_RELEASE_SCOPE: control-plane
      AETHERION_EXECUTION_DISABLED: "1"
      PORT: 5000
      PYTHONPATH: /app
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be configured for production}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured for production}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aetherion_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured for production}@postgres:5432/${POSTGRES_DB:-aetherion}"
      REDIS_URL: redis://redis:6379/0
      SERVER_URL: "${SERVER_URL:?Error: SERVER_URL must be configured for production}"
      FRONTEND_URL: "${FRONTEND_URL:?Error: FRONTEND_URL must be configured for production}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Error: ALLOWED_ORIGINS must be configured for production}"
      RUNNER_CONTAINER: 1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AETHERION_ALLOW_LOCAL_OAUTH: ${AETHERION_ALLOW_LOCAL_OAUTH:-0}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - workspace_prod_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/control-plane"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aetherion_prod_net

  frontend-auth:
    image: "${AETHERION_FRONTEND_AUTH_IMAGE:-aetherion-frontend-auth:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend-auth
    container_name: aetherion-frontend-auth-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - aetherion_prod_net

  worker-a:
    image: "${AETHERION_WORKER_IMAGE:-aetherion-worker:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aetherion-worker-a-prod
    restart: unless-stopped
    working_dir: /app/workspace
    environment:
      ENVIRONMENT: production
      AETHERION_RELEASE_SCOPE: control-plane
      AETHERION_EXECUTION_DISABLED: "1"
      WORKER_ID: ${WORKER_A_ID:-worker-a}
      MAX_CONCURRENCY: ${WORKER_A_MAX_CONCURRENCY:-4}
      CAPABILITIES: ${WORKER_A_CAPABILITIES:-DEFAULT,CPU}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aetherion_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured for production}@postgres:5432/${POSTGRES_DB:-aetherion}"
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/backend:/app/cli
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be configured for production}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured for production}"
    volumes:
      - workspace_prod_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - aetherion_prod_net

  worker-b:
    image: "${AETHERION_WORKER_IMAGE:-aetherion-worker:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aetherion-worker-b-prod
    restart: unless-stopped
    working_dir: /app/workspace
    environment:
      ENVIRONMENT: production
      AETHERION_RELEASE_SCOPE: control-plane
      AETHERION_EXECUTION_DISABLED: "1"
      WORKER_ID: ${WORKER_B_ID:-worker-b}
      MAX_CONCURRENCY: ${WORKER_B_MAX_CONCURRENCY:-4}
      CAPABILITIES: ${WORKER_B_CAPABILITIES:-DEFAULT,CPU}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aetherion_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured for production}@postgres:5432/${POSTGRES_DB:-aetherion}"
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/backend:/app/cli
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be configured for production}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured for production}"
    volumes:
      - workspace_prod_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - aetherion_prod_net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  workspace_prod_data:
    driver: local

networks:
  aetherion_prod_net:
    driver: bridge
