[pytest]
pythonpath = . backend cli
testpaths = tests cli/tests
norecursedirs = cli/aetherion_cli/skills scratch temp_* .git __pycache__
addopts = -m "not integration"
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    ignore:'isolated_filesystem' is deprecated:DeprecationWarning
markers =
    integration: requires an authorized external integration service
